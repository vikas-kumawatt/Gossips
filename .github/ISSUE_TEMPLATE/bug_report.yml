name: Bug report
description: Something behaves differently from how it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a security issue, stop.** Do not file it here — this form is public.
        Use the repository's **Security → Report a vulnerability** tab instead. That covers
        anything touching authentication, sessions, the BYOK key vault, the bot action
        validator, CSP/CORS, or the SSRF checks on owner-supplied endpoints.

  - type: dropdown
    id: surface
    attributes:
      label: Which part
      description: Best guess is fine — it decides where anyone looks first.
      options:
        - Web client (feed, profile, search, settings)
        - Chat and calls (messages, groups, voice/video)
        - API / server
        - AI bots (a bot behaving oddly, or not at all)
        - Admin panel
        - Deployment / CI
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        Avatars stopped loading on the chat list. They rendered as broken images;
        I expected the uploaded pictures.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Numbered, starting from a signed-out browser or a fresh server start.
        A bug nobody can reproduce is a bug nobody can fix.
      placeholder: |
        1. Sign in as a user who has uploaded a profile picture
        2. Open /chat
        3. Avatars are broken; the console shows a CSP violation
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, console output or a screenshot
      description: >
        Client bugs: the browser console, including the **first** error — later ones are
        usually consequences.
        Server bugs: `pm2 logs gossips-node --lines 40 --nostream` (or `gossips-python`).
        Redact anything that looks like a token, key or personal message before pasting.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Where
      description: Browser and version, or the server/environment. "Chrome 141 on Windows", "production EC2".
      placeholder: Chrome 141 on Windows 11

  - type: checkboxes
    id: sanity
    attributes:
      label: Ruled out
      description: >
        Two things account for a surprising share of "the client is broken" reports.
        Tick whichever you have checked — leaving them unticked is fine and honest.
      options:
        - label: >
            I hard-reloaded (Ctrl+Shift+R). A stale service worker serves the previous
            build, including the previous Content-Security-Policy, until it updates.
        - label: >
            I checked DevTools → Application → Service Workers, and unregistering it did
            not change the behaviour.
        - label: This still happens in a private window with extensions disabled.

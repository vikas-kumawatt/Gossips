<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo2.jpg" />
    <!--
      `interactive-widget=resizes-content` so the on-screen keyboard shrinks the
      layout viewport instead of panning it. Without it the default is
      `resizes-visual`: `100dvh` stays the full screen height and the browser slides
      the whole page up to reveal the focused input, which took the chat header off
      the top of the screen. With it, `dvh` shrinks and a flex column just gets
      shorter — the header stays put and only the message list loses height.

      `viewport-fit=cover` because the composer already pads itself with
      `env(safe-area-inset-bottom)`, and that resolves to 0px without this — so on a
      notched phone the send row sat under the home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Gossips</title>
  </head>
  <body>
    <!--
      The boot fallback.

      React's error boundaries cover a render that throws. They cannot cover the
      case where no React runs at all — a chunk that 404s after a deploy, a
      parse error in the bundle, a network that dies mid-download — and that is
      not hypothetical here: a bad chunk split once shipped and white-screened
      every visitor (see the note in vite.config.js). The result either way is
      an empty <div id="root"> and no explanation.

      Anything inside #root is replaced the moment createRoot().render() runs, so
      on a healthy load this is never seen. It starts at opacity 0 and fades in
      after five seconds, so a slow connection doesn't get a flash of it before
      the app arrives.

      Styles are inline because index.css is imported by main.jsx — if the bundle
      failed, the stylesheet failed with it.
    -->
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-mark" aria-hidden="true"></div>
        <h1>Gossips didn't finish loading</h1>
        <p>
          Something went wrong fetching the app — often a new version was just
          released. Reloading usually sorts it. If it keeps happening, try again
          in a little while.
        </p>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>

    <style>
      .boot-fallback {
        opacity: 0;
        animation: boot-fallback-in 0.4s ease 5s forwards;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      .boot-mark {
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 0.75rem;
        border-radius: 999px;
        border: 2px solid #262626;
        border-top-color: #737373;
        animation: boot-fallback-spin 1.1s linear infinite;
      }
      .boot-fallback h1 {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 500;
      }
      .boot-fallback p {
        margin: 0;
        max-width: 26rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #737373;
      }
      .boot-fallback button {
        margin-top: 1rem;
        padding: 0.375rem 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: #fff;
        color: #000;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      @keyframes boot-fallback-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-fallback-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Someone who asked for less motion gets the message without the spinner. */
      @media (prefers-reduced-motion: reduce) {
        .boot-fallback {
          animation-duration: 0.01ms;
        }
        .boot-mark {
          animation: none;
          border-top-color: #262626;
        }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
